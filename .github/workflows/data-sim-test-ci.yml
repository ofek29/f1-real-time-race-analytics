name: test_data_simulator

on:
  push:
    branches:
      - main
    paths:
      - 'data-simulator/**'
  pull_request:
    branches:
      - main
    paths:
      - 'data-simulator/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      broker:
        image: confluentinc/cp-kafka:7.8.0
        ports:
          - 9092:9092
          - 29092:29092
          - 29093:29093
        env:
          KAFKA_NODE_ID: 1
          KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_PROCESS_ROLES: 'broker,controller'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
          KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
          KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
          CLUSTER_ID: 'v-8hKdKQQ_O_VAReqBPr3Q'
          

      control-center:
        image: confluentinc/cp-enterprise-control-center:7.8.0
        ports:
          - 9021:9021
        env:
          CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker:29092'
          CONTROL_CENTER_REPLICATION_FACTOR: 1
          CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
          CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
          CONFLUENT_METRICS_TOPIC_REPLICATION: 1


    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Formatter
        uses: psf/black@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -r data-simulator/requirements.txt

      - name: Check static typing
        working-directory: data-simulator
        run: mypy ./

      - name: Check Kafka broker
        working-directory: data-simulator
        run: python tests/check_kafka_readiness.py
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Run tests
        working-directory: data-simulator
        run: pytest -s tests/ --verbose
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092